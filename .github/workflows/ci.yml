# Runs the tests and the type check on every push and pull request.
name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2

            - run: bun install

            - run: bun test

            - run: bun run typecheck
